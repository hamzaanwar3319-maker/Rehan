name: Windows desktop builds
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'customer-app/**'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main, marketplace-bot-license-keys-2026-11-24]
    paths:
      - 'desktop/**'
      - 'customer-app/**'
      - '.github/workflows/build-windows.yml'
concurrency:
  group: marketplace-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Admin dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Admin installer
        working-directory: desktop
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Marketplace-Bot-Admin-Windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
  customer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Customer dependencies
        working-directory: customer-app
        run: npm install --no-audit --no-fund
      - name: Build Customer installer
        working-directory: customer-app
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Marketplace-Bot-Customer-Windows
          path: customer-app/release/*.exe
          if-no-files-found: error
          retention-days: 14
