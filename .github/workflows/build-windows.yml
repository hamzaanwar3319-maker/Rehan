name: Build Marketplace Bot Admin for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin Electron version
        working-directory: desktop
        run: npm install --save-dev --save-exact electron@34.2.0

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win

      - name: Upload installer files
        uses: actions/upload-artifact@v4
        with:
          name: Marketplace-Bot-Admin-Windows-Installer
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
